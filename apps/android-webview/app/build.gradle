plugins { id 'com.android.application' }
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
android {
    namespace 'ru.napare.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.napare.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.1.4'
    }
    signingConfigs {
        release {
            if (System.getenv('NAPARE_SIGNING_STORE')) {
                storeFile file(System.getenv('NAPARE_SIGNING_STORE'))
                storePassword System.getenv('NAPARE_SIGNING_PASSWORD')
                keyAlias System.getenv('NAPARE_SIGNING_ALIAS')
                keyPassword System.getenv('NAPARE_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
