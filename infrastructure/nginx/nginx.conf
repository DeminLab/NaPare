events { worker_connections 1024; }

http {
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Docker can assign a new IP when a service container is recreated. Resolve
    # service names at request time instead of keeping startup-time IPs in upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    server {
        listen 80 default_server;
        server_name napare.sano.ru www.napare.sano.ru;
        absolute_redirect off;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $backend_service backend:3000;
            proxy_pass http://$backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /student/login { return 302 /login; }
        location = /student/register { return 302 /login; }
        location = /staff/login { return 302 /login; }
        location = /deanery/login { return 302 /login; }
        location = /student { return 302 /student/today; }
        location = /staff { return 302 /staff/today; }
        location = /deanery { return 302 /deanery/dashboard; }
        location = /developer { return 302 /developer/; }
        location = /max { return 301 /max/; }

        location /student/ {
            set $student_service web-student:3000;
            proxy_pass http://$student_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /staff/ {
            set $staff_service web-staff:3000;
            proxy_pass http://$staff_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /deanery/ {
            set $admin_service web-admin:3000;
            proxy_pass http://$admin_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /developer/ {
            set $developer_service web-developer:3000;
            proxy_pass http://$developer_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /max/ {
            # MAX opens the same public portal as a browser. The portal detects
            # MAX Bridge and hands authenticated users to their role workspace.
            set $portal_service web-portal:3000;
            rewrite ^/max/(.*)$ /$1 break;
            proxy_pass http://$portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            set $portal_service web-portal:3000;
            proxy_pass http://$portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
