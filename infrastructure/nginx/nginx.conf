events { worker_connections 1024; }

http {
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map "$status:$request_method:$uri" $log_security {
        ~^(?:401|403|404|429|5\d\d): 1;
        ~^2\d\d:(?:POST|PUT|PATCH|DELETE):/api/v1/(?:platform|admin)/ 1;
        default 0;
    }
    # Docker can assign a new IP when a service container is recreated. Resolve
    # service names at request time instead of keeping startup-time IPs in upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # The host Nginx reaches this loopback-published gateway through Docker's
    # bridge. Trust only its observed gateway address; do not trust client XFF.
    set_real_ip_from 172.22.0.1/32;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    log_format security '$remote_addr - [$time_iso8601] "$request" '
                        'status=$status bytes=$body_bytes_sent '
                        'request_time=$request_time ua="$http_user_agent"';
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    server {
        listen 80 default_server;
        server_name napare.sano.ru www.napare.sano.ru;
        absolute_redirect off;
        access_log /dev/stdout security if=$log_security;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keep probes for deployment metadata and backup files out of the app.
        location ~* "(^|/)(?:\.env(?:\.[^/]*)?|\.git|\.aws|\.docker|[^/]*\.(?:bak|backup|old|orig|save|swp|sql|dump|pem|key))($|/)" {
            return 404;
        }
        location = /config.json { return 404; }
        location ~* "(^|/)wp-config\.php(?:\.[^/]*)?$" { return 404; }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $backend_service backend:3000;
            proxy_pass http://$backend_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /student/login { return 302 /login; }
        location = /student/register { return 302 /login; }
        location = /staff/login { return 302 /login; }
        location = /deanery/login { return 302 /login; }
        location = /student { return 302 /student/today; }
        location = /staff { return 302 /staff/today; }
        location = /deanery { return 302 /deanery/dashboard; }
        location = /developer { return 302 /developer/; }
        location = /max { return 301 /max/; }

        location /student/ {
            set $student_service web-student:3000;
            proxy_pass http://$student_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /staff/ {
            set $staff_service web-staff:3000;
            proxy_pass http://$staff_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /deanery/ {
            set $admin_service web-admin:3000;
            proxy_pass http://$admin_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /developer/ {
            set $developer_service web-developer:3000;
            proxy_pass http://$developer_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /max/ {
            # MAX opens the same public portal as a browser. The portal detects
            # MAX Bridge and hands authenticated users to their role workspace.
            set $portal_service web-portal:3000;
            rewrite ^/max/(.*)$ /$1 break;
            proxy_pass http://$portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            set $portal_service web-portal:3000;
            proxy_pass http://$portal_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
