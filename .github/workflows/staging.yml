name: Build images and deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  image-prefix:
    name: Prepare image names
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/napare" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.name }} image
    needs: image-prefix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: backend
            file: apps/backend/Dockerfile
            build_args: ''
          - name: student web
            image: web-student
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-student
          - name: portal web
            image: web-portal
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-portal
          - name: staff web
            image: web-staff
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-staff
          - name: admin web
            image: web-admin
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-admin
          - name: developer web
            image: web-developer
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-developer
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ needs.image-prefix.outputs.prefix }}-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}

  deploy-staging:
    name: Deploy staging
    needs: [image-prefix, build-images]
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
      STAGING_DEPLOY_COMMAND: ${{ secrets.STAGING_DEPLOY_COMMAND }}
    steps:
      - name: Validate staging deployment secrets
        shell: bash
        run: |
          : "${STAGING_HOST:?Set STAGING_HOST}"
          : "${STAGING_USER:?Set STAGING_USER}"
          : "${STAGING_SSH_KEY:?Set STAGING_SSH_KEY}"
          : "${STAGING_KNOWN_HOSTS:?Set STAGING_KNOWN_HOSTS}"
          : "${STAGING_DEPLOY_COMMAND:?Set STAGING_DEPLOY_COMMAND}"
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable image set
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 "$STAGING_USER@$STAGING_HOST" \
            "export NAPARE_IMAGE_PREFIX='${{ needs.image-prefix.outputs.prefix }}' NAPARE_IMAGE_TAG='${{ github.event.workflow_run.head_sha }}'; $STAGING_DEPLOY_COMMAND"

  smoke-tests:
    name: Staging smoke tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - name: Validate staging URL
        run: ': "${STAGING_URL:?Set STAGING_URL}"'
      - name: Check API health
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 "$STAGING_URL/api/v1/health"
