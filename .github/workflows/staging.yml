name: Build and publish images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  image-prefix:
    name: Prepare image names
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/napare" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.name }} image
    needs: image-prefix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: backend
            file: apps/backend/Dockerfile
            build_args: ''
          - name: student web
            image: web-student
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-student
            package_name: '@napare/web-student'
          - name: portal web
            image: web-portal
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-portal
            package_name: '@napare/web-portal'
          - name: staff web
            image: web-staff
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-staff
            package_name: '@napare/web-staff'
          - name: admin web
            image: web-admin
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-admin
            package_name: '@napare/web-admin'
          - name: developer web
            image: web-developer
            file: infrastructure/docker/web.Dockerfile
            build_args: APP_DIR=apps/web-developer
            package_name: '@napare/web-developer'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.build_args }}
            PACKAGE_NAME=${{ matrix.package_name }}
          push: true
          tags: ${{ needs.image-prefix.outputs.prefix }}-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
