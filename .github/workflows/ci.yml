name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Verify security documentation and protected paths
        run: |
          node scripts/security-route-inventory.cjs --check
          node scripts/verify-ai-documentation.cjs
          node scripts/verify-role-workspace-boundaries.cjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        shell: bash
        run: pnpm --filter @napare/backend exec jest --ci --runInBand --coverage | tee unit-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: unit-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: apps/backend/coverage
          if-no-files-found: warn

  e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: napare_test
          POSTGRES_USER: napare
          POSTGRES_PASSWORD: napare_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U napare -d napare_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: napare_test
      DB_USERNAME: napare_runtime
      DB_PASSWORD: ci_runtime_password_only
      DATABASE_URL: postgresql://napare_runtime:ci_runtime_password_only@127.0.0.1:5432/napare_test
      JWT_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create disposable authorization test databases
        env:
          PGPASSWORD: napare_test_password
        run: |
          psql -h 127.0.0.1 -U napare -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE napare_runtime LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci_runtime_password_only'"
          psql -h 127.0.0.1 -U napare -d postgres -v ON_ERROR_STOP=1 -c "ALTER DATABASE napare_test OWNER TO napare_runtime"
          createdb -h 127.0.0.1 -U napare -O napare_runtime curation_test_ci
          createdb -h 127.0.0.1 -U napare -O napare_runtime curation_test_platform_ci
          createdb -h 127.0.0.1 -U napare -O napare_runtime curation_test_tenant_ci
          createdb -h 127.0.0.1 -U napare -O napare_runtime curation_test_payment_ci
      - name: Run E2E tests
        shell: bash
        env:
          CURATION_TEST_DATABASE_URL: postgresql://napare_runtime:ci_runtime_password_only@127.0.0.1:5432/curation_test_ci
          PLATFORM_TEST_DATABASE_URL: postgresql://napare_runtime:ci_runtime_password_only@127.0.0.1:5432/curation_test_platform_ci
          TENANT_TEST_DATABASE_URL: postgresql://napare_runtime:ci_runtime_password_only@127.0.0.1:5432/curation_test_tenant_ci
          PAYMENT_TEST_DATABASE_URL: postgresql://napare_runtime:ci_runtime_password_only@127.0.0.1:5432/curation_test_payment_ci
          TENANT_RLS_TEST_ADMIN_URL: postgresql://napare:napare_test_password@127.0.0.1:5432/postgres
        run: pnpm test:e2e | tee e2e-test-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-report
          path: e2e-test-report.txt

  build:
    name: Production application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > security-audit.json
          status=$?
          cat security-audit.json
          AUDIT_STATUS=$status node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('security-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities;

          if (!counts) {
            console.error(`Audit did not return vulnerability counts (pnpm exit ${process.env.AUDIT_STATUS})`);
            process.exit(1);
          }

          const high = Number(counts.high || 0);
          const critical = Number(counts.critical || 0);
          console.log(`High: ${high}; critical: ${critical}`);
          if (high + critical > 0) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: security-audit.json
