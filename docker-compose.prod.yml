services:
  postgres:
    image: postgres:16-alpine
    container_name: napare-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: napare-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: napare-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-napare-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-napare_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-napare_minio_secret}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-student:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-student
    container_name: napare-web-student
    restart: always
    ports:
      - '3001:3000'
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

  web-staff:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-staff
    container_name: napare-web-staff
    restart: always
    ports:
      - '3002:3000'
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

  web-admin:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-admin
    container_name: napare-web-admin
    restart: always
    ports:
      - '3003:3000'
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

  web-developer:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-developer
    container_name: napare-web-developer
    restart: always
    ports:
      - '3004:3000'
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: napare-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web-student
      - web-staff
      - web-admin
      - web-developer

volumes:
  postgres_data:
  redis_data:
