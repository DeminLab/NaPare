services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web-portal: &web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-portal
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      HOSTNAME: '0.0.0.0'
      BACKEND_URL: http://backend:3000
    networks: [edge, app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web-student:
    <<: *web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-student
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://napare.sano.ru/student}
        NEXT_PUBLIC_TEACHER_URL: ${NEXT_PUBLIC_TEACHER_URL:-https://napare.sano.ru/staff}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://napare.sano.ru/deanery}
        NEXT_PUBLIC_DEVELOPER_URL: ${NEXT_PUBLIC_DEVELOPER_URL:-https://developer.napare.sano.ru}
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3002:3000'
    environment:
      HOSTNAME: '0.0.0.0'
      BACKEND_URL: http://backend:3000
    networks: [edge, app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  web-staff:
    <<: *web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-staff
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://napare.sano.ru/student}
        NEXT_PUBLIC_TEACHER_URL: ${NEXT_PUBLIC_TEACHER_URL:-https://napare.sano.ru/staff}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://napare.sano.ru/deanery}
        NEXT_PUBLIC_DEVELOPER_URL: ${NEXT_PUBLIC_DEVELOPER_URL:-https://developer.napare.sano.ru}
    ports:
      - '127.0.0.1:3003:3000'

  web-admin:
    <<: *web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-admin
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://napare.sano.ru/student}
        NEXT_PUBLIC_TEACHER_URL: ${NEXT_PUBLIC_TEACHER_URL:-https://napare.sano.ru/staff}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://napare.sano.ru/deanery}
        NEXT_PUBLIC_DEVELOPER_URL: ${NEXT_PUBLIC_DEVELOPER_URL:-https://developer.napare.sano.ru}
    ports:
      - '127.0.0.1:3004:3000'

  web-developer:
    <<: *web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP_DIR: apps/web-developer
        BACKEND_URL: http://backend:3000
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://napare.sano.ru/student}
        NEXT_PUBLIC_TEACHER_URL: ${NEXT_PUBLIC_TEACHER_URL:-https://napare.sano.ru/staff}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://napare.sano.ru/deanery}
        NEXT_PUBLIC_DEVELOPER_URL: ${NEXT_PUBLIC_DEVELOPER_URL:-https://developer.napare.sano.ru}
    ports:
      - '127.0.0.1:3005:3000'

  max-miniapp:
    build:
      context: .
      dockerfile: apps/max-miniapp/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3006:8080'
    networks: [edge]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, app]
    depends_on:
      backend:
        condition: service_healthy
      web-student:
        condition: service_healthy
      web-portal:
        condition: service_healthy
      web-staff:
        condition: service_healthy
      web-admin:
        condition: service_healthy
      web-developer:
        condition: service_healthy
      max-miniapp:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
